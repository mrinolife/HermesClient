name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and capture log
        run: |
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | tail -50
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Package
        if: success()
        run: |
          mkdir -p Payload
          cp -r Build/Build/Products/Release-iphoneos/HermesClient.app Payload/
          zip -r HermesClient-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HermesClient-unsigned
          path: HermesClient-unsigned.ipa
          retention-days: 7
