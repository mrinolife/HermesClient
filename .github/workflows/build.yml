name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show targets and sources
        run: |
          echo "=== XCODE TARGETS ==="
          xcodebuild -list -project HermesClient.xcodeproj
          echo "=== BUILD SETTINGS ==="
          xcodebuild -project HermesClient.xcodeproj \
            -scheme HermesClient -showBuildSettings 2>/dev/null | grep -i "swift\|src\|infoplist\|bundle" | head -20

      - name: Build
        run: |
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>/tmp/build.log
          EC=$?
          echo "EXIT_CODE=$EC"
          echo "ERRORS:"
          grep "error:" /tmp/build.log | head -5
          echo "FATAL:"
          grep "fatal\|FATAL\|Error" /tmp/build.log | head -5
          echo "TAIL:"
          tail -5 /tmp/build.log
          exit $EC
