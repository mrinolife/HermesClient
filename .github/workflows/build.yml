name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show project structure
        run: |
          echo "=== Files ==="
          find . -name "*.swift" -type f | head -20
          echo "=== Schemas ==="
          xcodebuild -list -project HermesClient.xcodeproj 2>&1

      - name: Build
        run: |
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -30
