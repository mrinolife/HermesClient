name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/build.log; EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "=== LAST 20 LINES OF BUILD ==="
          tail -20 /tmp/build.log
          echo "=== END ==="
          echo "BUILD_EXIT=$EXIT_CODE" >> $GITHUB_ENV
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3

      - name: Package
        run: |
          cp -r Build/Build/Products/Release-iphoneos/HermesClient.app Payload/ 2>/dev/null && echo "App found" || echo "No app"
          ls -la Payload/ 2>/dev/null || true

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HermesClient-unsigned
          path: Payload/
          retention-days: 7
