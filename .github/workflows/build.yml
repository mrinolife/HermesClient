name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen
          echo "ready"

      - name: Generate
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | grep -E "(error:|fatal:|BUILD|EXIT)" | head -20; exit ${PIPESTATUS[0]}
