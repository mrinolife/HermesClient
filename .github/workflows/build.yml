name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        id: build
        run: |
          set +e
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build > /tmp/xcodebuild.log 2>&1
          EC=$?
          echo "EXIT_CODE=$EC" >> $GITHUB_OUTPUT
          echo "exit code: $EC"
          echo "=== ERRORS ==="
          grep -i "error:" /tmp/xcodebuild.log | head -20
          echo "=== LAST 10 ==="
          tail -10 /tmp/xcodebuild.log
          exit $EC
