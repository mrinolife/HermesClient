name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project HermesClient.xcodeproj \
            -scheme HermesClient \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/build_full.log | tail -80

      - name: Check results
        if: always()
        run: |
          echo "=== Build products ==="
          find Build -name "*.app" -type d 2>/dev/null
          echo "=== Build log size ==="
          wc -l /tmp/build_full.log 2>/dev/null || echo "no log"
          echo "=== ERROR lines ==="
          grep -i "error:" /tmp/build_full.log 2>/dev/null | tail -10
          echo "=== Last 5 lines ==="
          tail -5 /tmp/build_full.log 2>/dev/null

      - name: Package
        if: success()
        run: |
          mkdir -p Payload
          cp -r Build/Build/Products/Release-iphoneos/HermesClient.app Payload/ && echo "App copied" || echo "No app found"
          zip -r HermesClient-unsigned.ipa Payload/ 2>/dev/null
          rm -rf Payload

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HermesClient-unsigned
          path: HermesClient-unsigned.ipa
          retention-days: 7
